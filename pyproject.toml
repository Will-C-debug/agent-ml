[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-agent"
version = "0.1.0"
description = "A local machine-learning engineer agent built on LangChain + LangGraph that trains models with FLAML AutoML."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-anthropic>=1.7",
    "flaml[automl]>=2.7",
    "scikit-learn>=1.6",  # GroupKFold(shuffle=...)
    "pandas>=2.2",
    "pyarrow>=16",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.1"]
openai = ["langchain-openai>=1.0"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
ml-agent = "ml_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
